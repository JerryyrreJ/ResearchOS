[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "researchos"
version = "0.1.0"
description = "Deterministic asset foundation for ResearchOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "numpy==1.26.3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pymupdf>=1.25,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "scipy>=1.12,<1.15",
  "statsmodels>=0.14,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
data-plugins = [
  "akshare>=1.17,<2",
  "pandas>=2.2,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/researchos", "apps"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "docs/ResearchOS_Handoff_A_Data_Ontology_v1.1",
  "apps/researchos_api",
  "services/macrotrace",
  "scripts/macrotrace",
  "tests/integration",
  "tests/unit",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
